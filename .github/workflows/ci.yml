name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Set up .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies for APIs
      if: matrix.language == 'csharp'
      run: dotnet restore
      working-directory: src

    - name: Build APIs
      if: matrix.language == 'csharp'
      run: dotnet build --configuration Release --no-restore
      working-directory: src

    - name: Set up Node.js
      if: matrix.language == 'javascript'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: src/contosotraders-ui-website/package-lock.json

    - name: Install UI dependencies
      if: matrix.language == 'javascript'
      run: npm ci
      working-directory: src/contosotraders-ui-website

    - name: Build UI
      if: matrix.language == 'javascript'
      run: npm run build
      working-directory: src/contosotraders-ui-website

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Scan .NET dependencies for vulnerabilities
      run: |
        dotnet restore src/
        dotnet list src/ package --vulnerable --include-transitive | tee dotnet-vulnerabilities.txt || true
      continue-on-error: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: src/contosotraders-ui-website/package-lock.json

    - name: Install UI dependencies
      run: npm ci
      working-directory: src/contosotraders-ui-website

    - name: Scan npm dependencies for vulnerabilities
      run: |
        cd src/contosotraders-ui-website
        npm audit --audit-level moderate --json | tee ../../npm-audit.json || true
      continue-on-error: true

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: |
          dotnet-vulnerabilities.txt
          npm-audit.json

  sonar-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarQube scanner
      uses: actions/cache@v4
      with:
        path: ./.sonar/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarQube scanner
      run: |
        mkdir -p .sonar/scanner
        wget -O .sonar/scanner/sonar-scanner-cli.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856.zip
        unzip .sonar/scanner/sonar-scanner-cli.zip -d .sonar/scanner/
        echo "SONAR_SCANNER_HOME=$(pwd)/.sonar/scanner/sonar-scanner-4.8.0.2856/bin" >> $GITHUB_ENV
        echo "$(pwd)/.sonar/scanner/sonar-scanner-4.8.0.2856/bin" >> $GITHUB_PATH

    - name: Restore .NET dependencies
      run: dotnet restore src/

    - name: Build .NET project
      run: dotnet build src/ --configuration Release

    - name: Run SonarQube analysis
      run: |
        sonar-scanner \
          -Dsonar.projectKey=ContosoTraders \
          -Dsonar.sources=src/ \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.cs.dotcover.reportsPaths=coverage.xml \
          -Dsonar.javascript.lcov.reportPaths=src/contosotraders-ui-website/coverage/lcov.info
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies for APIs
      run: dotnet restore
      working-directory: src

    - name: Build APIs
      run: dotnet build --configuration Release --no-restore
      working-directory: src

    - name: Test APIs
      run: dotnet test --configuration Release --no-build --verbosity normal
      working-directory: src

    - name: Publish API
      run: dotnet publish ContosoTraders.Api/ContosoTraders.Api.csproj --configuration Release --output ./publish/api
      working-directory: src

    - name: Upload API artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-artifact
        path: src/publish/api/

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: src/contosotraders-ui-website/package-lock.json

    - name: Install UI dependencies
      run: npm ci
      working-directory: src/contosotraders-ui-website

    - name: Test UI
      run: npm test -- --watchAll=false
      working-directory: src/contosotraders-ui-website

    - name: Build UI
      run: npm run build
      working-directory: src/contosotraders-ui-website

    - name: Upload UI build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ui-build
        path: src/contosotraders-ui-website/build/

  deploy-ui:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Download UI build artifact
      uses: actions/download-artifact@v4
      with:
        name: ui-build
        path: ./ui-build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./ui-build

  deploy-api:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Download API artifact
      uses: actions/download-artifact@v4
      with:
        name: api-artifact
        path: ./api-artifact

    - name: Create deployment package
      run: |
        mkdir -p deployment
        cp -r api-artifact/* deployment/
        echo "API deployment package created"

    - name: Upload deployment package
      uses: actions/upload-artifact@v4
      with:
        name: api-deployment
        path: deployment/

    - name: Build UI
      run: npm run build
      working-directory: src/ContosoTraders.Ui.Website